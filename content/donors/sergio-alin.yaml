# השם שיופיע בכותרת הלשונית ובתצוגה המקדימה בוואטסאפ
name: "סרחיו ואלין"

# פנייה אישית בראש הדף
greeting: "סרחיו ואלין היקרים, תודה שאתם שותפים למסע שלנו. רצינו לשתף אתכם בעשייה ובהשפעה של צמד ברזל בחודש האחרון."

# אזור התודה בסוף הדף (לשון רבים)
thanksTitle: "תודה שאתם חלק מהדרך"
thanksText:
  - "השותפות שלכם מאפשרת לנו להמשיך ולהביא את רוח האחווה והערבות ההדדית של המילואימניקים לעוד ועוד אנשים ברחבי הארץ."
  - "ביחד אנחנו הופכים את החיבור שנוצר בשדה הקרב למציאות של אמון, אחריות ועשייה משותפת בחברה הישראלית."
