name: "רכז/ת יקר/ה"

greeting: "רכז/ת יקר/ה, תודה על השותפות והאמון. רצינו לשתף אותך בעשייה ובהשפעה של צמד ברזל בחודש האחרון."

thanksTitle: "תודה שאת/ה חלק מהדרך"
thanksText:
  - "השותפות שלך מאפשרת לנו להמשיך ולהביא את רוח האחווה והערבות ההדדית של המילואימניקים לעוד ועוד אנשים ברחבי הארץ."
  - "ביחד אנחנו הופכים את החיבור שנוצר בשדה הקרב למציאות של אמון, אחריות ועשייה משותפת בחברה הישראלית."
