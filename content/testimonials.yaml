# ==========================================================
#  קולות מהשטח – פידבקים
#
#  יש להזין כאן אך ורק ציטוטים אמיתיים שהתקבלו.
#
#  text      = טקסט הפידבק, כפי שנמסר.
#  name      = שם פרטי. יוצג רק אם showName: true.
#  role      = תפקיד ומקום, למשל "מנהלת, תיכון אוולינה ירושלים".
#  showName  = true רק אם התקבל אישור לפרסם את השם.
#  approved  = true רק אם התקבל אישור לפרסם את הפידבק.
#  featured  = true כדי להקדים את הפידבק לראש הרשימה.
#  status    = published להצגה, draft להסתרה.
#
#  הסדר בקובץ = סדר ההצגה באתר.
# ==========================================================

items:
  - text: "אותנטי, פותח לב, מעניין, מסקרן. בא לשמוע אתכם עוד ולגעת בכם כמו שנגעת בלבבות 300 תלמידים שישבו מרותקים. נשבעת, ציפור לא צייצה במשך שעה!!"
    name: "איריס"
    role: "סמנכ״לית משרד החינוך לשעבר"
    showName: true
    approved: true
    status: published

  - text: "וואו וואו וואו! הייתה הרצאה מדהימה! הם העבירו מסר חשוב שאני מרגישה שהבנות צריכות לשמוע! ומה שהיה הכי חזק, בזמן השאלות הורגש שהבנות מכוונות בעיקר לשאלות טעונות מאוד נגד השמאל, אבל המרצים היו מדהימים, קיבלו, ענו בנועם והמשיכו לנתב את השיחה לשמירה על כבוד, להצליח לשמוע את הצד השני גם כשלא מסכימים איתו. מודה על ההזדמנות ואני חושבת שצריך להמשיך לחנך אותן לשמוע ולאהוב את העם המדהים שלנו על כל גווניו ❤️ תודה רבה"
    name: "רות"
    role: "מנהלת, תיכון אוולינה ירושלים"
    showName: true
    approved: true
    status: published

  - text: "היה מפגש מרתק, מעניין ורלוונטי מאוד עבור התלמידים. הם הגישו אותו בצורה מאוד ידידותית, בגובה העיניים וישירה. השיחה הייתה מאוד מעניינת, כל המהלך היה בביצוע ממש טוב והעביר את המסר של איחוד והקשבה. והצמד עצמו היה מקסים."
    name: "איריס"
    role: "מחנכת, מקיף באר שבע"
    showName: true
    approved: true
    status: published

  - text: "הם היו פשוט מדהימים! לא פשוט להחזיק שעה חבר׳ה עם בעיות קשב וריכוז, והם עשו את זה מעולה!"
    name: "ירין"
    role: "רכז, אמית טכנולוגי באר שבע"
    showName: true
    approved: true
    status: published

  - text: "היום זכו תלמידי חטיבת הביניים לשמוע הרצאה מדהימה של ״צמד ברזל״. ערן ישראלי ועדי בומש סיפרו על אירועי ה־7.10 מנקודת מבטם. כל אחד מהם מגיע מעולם תרבותי שונה בתוך החברה הישראלית, אך במהלך שירות המילואים הם בחרו להדגיש דווקא את המשותף והמחבר. הם לימדו אותנו שלא צריך לחכות לרגעי משבר וסכנה כדי להיות מאוחדים, ובאמצעות כמה כללי ברזל נוכל לשמור על חיבור ואחדות גם בימי שגרה. בתקווה שנזכה!"
    name: "אהרון"
    role: "מורה, מקיף ז׳ באר שבע"
    showName: true
    approved: true
    status: published

  - text: "הם היו קשובים לתלמידים והצליחו להחזיק את רובם למשך 45 דקות, שזה שיא אצלנו. המורות הרגישו שהמפגש היה חיובי וטוב."
    name: "שלום"
    role: "מורה, ברנקו וייס"
    showName: true
    approved: true
    status: published

  - text: "הצמד מדהים. כמה מסרים וכמה קשב היה... לא קורה בכל הרצאה."
    name: "גלית"
    role: "מורה, אורט חקלאי פרדס חנה"
    showName: true
    approved: true
    status: published

  - text: "היה ממש טוב. התלמידים נהנו. הייתה הרצאה מלמדת, בנושא חשוב ועכשווי."
    name: "סאשה"
    role: "רכזת, עירוני ג׳ חיפה"
    showName: true
    approved: true
    status: published

  - text: "במילה אחת – מעולה."
    name: "מיכל"
    role: "רכזת נוער, עמק חפר"
    showName: true
    approved: true
    status: published

  - text: "הילדים לא נתנו להם ללכת, ממש צבאו עליהם עם שאלות וסקרנות."
    role: ""
    approved: true
    status: published

