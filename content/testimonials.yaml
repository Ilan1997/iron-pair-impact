items:
  - text: "וואו וואו וואו! הייתה הרצאה מדהימה! הם העבירו מסר חשוב שאני מרגישה שהבנות צריכות לשמוע! ומה שהיה הכי חזק, בזמן השאלות הורגש שהבנות מכוונות בעיקר לשאלות טעונות מאוד נגד השמאל, אבל המרצים היו מדהימים, קיבלו, ענו בנועם והמשיכו לנתב את השיחה לשמירה על כבוד, להצליח לשמוע את הצד השני גם כשלא מסכימים איתו. מודה על ההזדמנות ואני חושבת שצריך להמשיך לחנך אותן לשמוע ולאהוב את העם המדהים שלנו על כל גווניו ❤️ תודה רבה"
    role: ""
    approved: true
    featured: true
    status: published

  - text: "הם היו פשוט מדהימים! לא פשוט להחזיק שעה חבר׳ה עם בעיות קשב וריכוז, והם עשו את זה מעולה!"
    role: ""
    approved: true
    featured: true
    status: published

  - text: "מה יפים הם פני החברה שלנו כשפוגשים אותם פנים אל פנים."
    role: ""
    approved: true
    featured: true
    status: published

  - text: "היום זכו תלמידי חטיבת הביניים לשמוע הרצאה מדהימה של ״צמד ברזל״. ערן ישראלי ועדי בומש סיפרו על אירועי ה־7.10 מנקודת מבטם. כל אחד מהם מגיע מעולם תרבותי שונה בתוך החברה הישראלית, אך במהלך שירות המילואים הם בחרו להדגיש דווקא את המשותף והמחבר. הם לימדו אותנו שלא צריך לחכות לרגעי משבר וסכנה כדי להיות מאוחדים, ובאמצעות כמה כללי ברזל נוכל לשמור על חיבור ואחדות גם בימי שגרה. בתקווה שנזכה!"
    role: ""
    approved: true
    status: published

  - text: "הצמד מדהים. כמה מסרים וכמה קשב היה... לא קורה בכל הרצאה."
    role: ""
    approved: true
    status: published

  - text: "היה מפגש מרתק, מעניין ורלוונטי מאוד עבור התלמידים. הם הגישו אותו בצורה מאוד ידידותית, בגובה העיניים וישירה. השיחה הייתה מאוד מעניינת, כל המהלך היה בביצוע ממש טוב והעביר את המסר של איחוד והקשבה. והצמד עצמו היה מקסים."
    role: ""
    approved: true
    status: published

  - text: "הילדים לא נתנו להם ללכת, ממש צבאו עליהם עם שאלות וסקרנות."
    role: ""
    approved: true
    status: published

  - text: "היה ממש טוב. התלמידים נהנו. הייתה הרצאה מלמדת, בנושא חשוב ועכשווי."
    role: ""
    approved: true
    status: published

  - text: "הצמד היה מעולה. שמעתי אותם ברכזי חינוך חברתי לפני שנה ולא קישרתי שזה הם עד שראיתי את ארז. שמחה מאוד שהגיעו. התלמידים והמורים החמיאו, אמרו שהיו טובים ושהנושא חשוב מאוד ורלוונטי."
    role: ""
