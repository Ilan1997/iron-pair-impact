# ==========================================================
#  השפעה ברשתות ובתקשורת – סרטונים וכתבות
#
#  type      = youtube (סרטון) או article (כתבה בקישור)
#  url       = הקישור המלא. ליוטיוב אפשר להדביק כל סוג קישור
#              (youtube.com/watch?v=... או youtu.be/...)
#  title     = כותרת הכתבה/הסרטון
#  outlet    = שם כלי התקשורת (אופציונלי)
#  date      = תאריך פרסום, שנה-חודש-יום (אופציונלי)
#  status    = published להצגה, draft להסתרה.
#
#  סרטוני יוטיוב נטענים רק כשלוחצים עליהם, כדי שהאתר יישאר מהיר.
# ==========================================================

